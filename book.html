<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>خلاصه کتاب</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <nav class="site-nav">
    <div class="wrap">
      <a class="brand" href="index.html">
        <span class="mark">ق</span>
        قفسه کتاب من
      </a>
      <div class="nav-links">
        <a href="index.html">خانه</a>
        <a href="index.html#books">کتاب‌ها</a>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="تغییر پوسته"></button>
      </div>
    </div>
  </nav>

  <div class="wrap">
    <a class="back-link" href="index.html"><span id="back-icon"></span> بازگشت به قفسه</a>
    <div id="content">
      <p class="empty-state">در حال بارگذاری...</p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('back-icon').innerHTML = ICONS.arrowRight;

    const SECTION_MAP = {
      'خلاصه': 'summary',
      'نکات کلیدی': 'key-ideas',
      'برداشت من': 'takeaways',
      'برداشت شخصی': 'takeaways',
    };

    function tagFirstList(html, cls) {
      return html.replace(/<(ul|ol)>/, `<$1 class="${cls}">`);
    }

    // Scans the raw markdown for #, ##, ### and #### headings in document
    // order, assigning each a stable, hierarchical anchor id (e.g. sec-0,
    // sec-0-1, sec-0-1-0, sec-0-1-0-2) based on its nearest preceding
    // heading of a shallower level.
    function buildOutline(body) {
      const outline = [];
      const path = []; // stack of {level, id} ancestors currently "open"
      const siblingCount = {}; // parentId ('root' at top) -> next sibling index

      body.split('\n').forEach((line) => {
        const m = line.match(/^(#{1,4})\s+(.+)$/);
        if (!m) return;
        const level = m[1].length;
        const heading = m[2].trim();

        while (path.length && path[path.length - 1].level >= level) path.pop();
        const parentId = path.length ? path[path.length - 1].id : 'root';

        siblingCount[parentId] = siblingCount[parentId] || 0;
        const idx = siblingCount[parentId]++;
        const id = (parentId === 'root' ? 'sec' : parentId) + '-' + idx;

        path.push({ level, id });
        outline.push({ level, heading, id, parentId: parentId === 'root' ? null : parentId });
      });
      return outline;
    }

    // Turns the flat outline into a real tree (arbitrary depth) using parentId.
    function buildTocTree(outline) {
      const nodes = {};
      const roots = [];
      outline.forEach((item) => {
        nodes[item.id] = { heading: item.heading, id: item.id, level: item.level, children: [] };
      });
      outline.forEach((item) => {
        if (item.parentId && nodes[item.parentId]) {
          nodes[item.parentId].children.push(nodes[item.id]);
        } else {
          roots.push(nodes[item.id]);
        }
      });
      return roots;
    }

    function findNode(tree, id) {
      for (const node of tree) {
        if (node.id === id) return node;
        const found = findNode(node.children, id);
        if (found) return found;
      }
      return null;
    }

    function renderSection(sec, id, subHeadings) {
      const kind = SECTION_MAP[sec.heading] || 'generic';
      let html = marked.parse(sec.content);
      if (subHeadings && subHeadings.length) {
        let i = 0;
        // ### and #### become <h3>/<h4> via marked, in the same document
        // order as subHeadings, so we can assign ids positionally.
        html = html.replace(/<h[34]>/g, (tag) => {
          const sub = subHeadings[i++];
          return sub ? tag.replace('>', ` id="${sub.id}">`) : tag;
        });
      }
      const Tag = sec.level === 1 ? 'h1' : 'h2';
      if (kind === 'summary') {
        return `<section class="block" id="${id}"><${Tag}>${sec.heading}</${Tag}><div class="prose">${html}</div></section>`;
      }
      if (kind === 'key-ideas') {
        return `<section class="block" id="${id}"><${Tag}>${sec.heading}</${Tag}>${tagFirstList(html, 'key-ideas')}</section>`;
      }
      if (kind === 'takeaways') {
        return `<section class="block" id="${id}"><${Tag}>${sec.heading}</${Tag}>${tagFirstList(html, 'takeaways')}</section>`;
      }
      return `<section class="block" id="${id}"><${Tag}>${sec.heading}</${Tag}><div class="prose">${html}</div></section>`;
    }

    function countTocNodes(nodes) {
      return nodes.reduce((n, t) => n + 1 + countTocNodes(t.children), 0);
    }

    function renderTocNode(node) {
      const cls = `toc-lvl${node.level}`;
      const sub = node.children.length
        ? `<ul class="toc-sub">${node.children.map(renderTocNode).join('')}</ul>`
        : '';
      return `<li class="${cls}"><a href="#${node.id}">${node.heading}</a>${sub}</li>`;
    }

    function tocHTML(tree) {
      if (countTocNodes(tree) < 2) return '';
      return `<nav class="toc"><p class="toc-title">فهرست مطالب</p><ul>${tree
        .map(renderTocNode)
        .join('')}</ul></nav>`;
    }

    const params = new URLSearchParams(location.search);
    const slug = params.get('b');
    const contentEl = document.getElementById('content');

    async function render() {
      if (!slug) {
        contentEl.innerHTML = '<p class="empty-state">کتابی مشخص نشده است.</p>';
        return;
      }
      const [book, manifest] = await Promise.all([fetchBook(slug), fetchManifest()]);
      const { meta, body } = book;
      document.title = meta.title || 'خلاصه کتاب';

      const cover = coverStyle(slug);
      const hasImage = !!meta.cover;
      const coverStyleAttr = hasImage
        ? `background-image:url('${meta.cover}'); background-size:cover; background-position:center;`
        : `background:${cover.bg}; color:${cover.text};`;
      const rawSections = splitSections(body);
      const outline = buildOutline(body);
      const tree = buildTocTree(outline);
      const toc = tocHTML(tree);
      // rawSections (split on # / ##) and blockOutline (outline filtered to
      // level <= 2) walk the same heading lines in the same order.
      const blockOutline = outline.filter((o) => o.level <= 2);
      const sections = rawSections
        .map((sec, i) => {
          const blockItem = blockOutline[i];
          const id = blockItem ? blockItem.id : `sec-${i}`;
          // Every ### / #### between this block's heading and the next
          // one belongs to it, however deep it's nested.
          let subHeadings = [];
          if (blockItem) {
            const startIdx = outline.indexOf(blockItem);
            const nextBlock = blockOutline[i + 1];
            const endIdx = nextBlock ? outline.indexOf(nextBlock) : outline.length;
            subHeadings = outline.slice(startIdx + 1, endIdx).filter((o) => o.level >= 3);
          }
          return renderSection(sec, id, subHeadings);
        })
        .join('');
      const stars = starString(meta.rating);

      const metaItems = [
        meta.category ? `<span class="pill-tag">${meta.category}</span>` : '',
        meta.year_publish ? `<span class="item">${ICONS.calendar} سال انتشار: ${toPersianDigits(meta.year_publish)}</span>` : '',
        meta.date_read ? `<span class="item">${ICONS.calendar} خواندم: ${toPersianDigits(meta.date_read)}</span>` : '',
        meta.read_minutes ? `<span class="item">${ICONS.clock} ${toPersianDigits(meta.read_minutes)} دقیقه مطالعه</span>` : '',
      ]
        .filter(Boolean)
        .join('');

      contentEl.innerHTML = `
        <div class="detail-grid">
          <div class="detail-cover" style="${coverStyleAttr}">
            ${hasImage ? '' : `<span class="cover-title">${meta.title || slug}</span>`}
          </div>
          <div>
            <h1 class="book-title">${meta.title || slug}</h1>
            <p class="book-byline">${meta.author || ''}</p>
            <div class="meta-row">${metaItems}</div>
            ${stars ? `<div class="rating">${stars} <span class="num">${toPersianDigits(meta.rating)}/۵</span></div>` : ''}
            ${meta.quote ? `<div class="quote-box">«${meta.quote}»</div>` : ''}
            ${toc}
            ${sections}
          </div>
        </div>
      `;

      // Prev / next navigation based on manifest order.
      const idx = manifest.indexOf(slug);
      const prevSlug = idx > 0 ? manifest[idx - 1] : null;
      const nextSlug = idx >= 0 && idx < manifest.length - 1 ? manifest[idx + 1] : null;
      const footer = document.createElement('div');
      footer.className = 'detail-footer';
      footer.innerHTML = `
        ${prevSlug ? `<a href="book.html?b=${prevSlug}">${ICONS.arrowRight} کتاب قبلی</a>` : '<span></span>'}
        ${nextSlug ? `<a href="book.html?b=${nextSlug}">کتاب بعدی ${ICONS.arrowLeft}</a>` : '<span></span>'}
      `;
      document.querySelector('.wrap').appendChild(footer);
    }

    render().catch((err) => {
      contentEl.innerHTML = `<p class="empty-state">خطا: ${err.message}</p>`;
    });
  </script>
</body>
</html>
